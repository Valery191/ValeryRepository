[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    -p no:cacheprovider
markers =
    smoke: quick critical path tests
    regression: full regression suite
    customers: customer management module
    deals: sales pipeline module
    bdd: behavior-driven scenarios
